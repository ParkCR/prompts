<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 提示词灵感库</title>
    <style>
        /* ============================================================
           FONTS
           ============================================================ */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Geist+Mono:wght@400;500&display=swap');

        /* ============================================================
           CSS VARIABLES — 朱砂红 · 文献感主题
           ============================================================ */
        :root {
            --color-primary: oklch(0.50 0.16 25);
            --color-primary-light: oklch(0.65 0.14 25);
            --color-primary-dark: oklch(0.40 0.14 25);
            --color-primary-bg: oklch(0.94 0.04 25 / 0.25);
            --color-primary-ring: oklch(0.50 0.16 25 / 0.35);
            --color-bg: oklch(0.97 0.008 85);
            --color-card: oklch(0.995 0.004 85);
            --color-card-hover: oklch(1 0 0);
            --color-text: oklch(0.15 0.01 0);
            --color-text-secondary: oklch(0.38 0.008 0);
            --color-text-muted: oklch(0.58 0.008 0);
            --color-border: oklch(0.88 0.008 85);
            --color-border-light: oklch(0.93 0.006 85);
            --shadow: 0 2px 12px oklch(0 0 0 / 0.05), 0 1px 4px oklch(0 0 0 / 0.03);
            --shadow-hover: 0 8px 28px oklch(0 0 0 / 0.07), 0 2px 8px oklch(0 0 0 / 0.04);
            --shadow-modal: 0 24px 64px oklch(0 0 0 / 0.18);
            --radius: 12px;
            --radius-sm: 6px;
            --font-serif: 'Noto Serif SC', 'Source Han Serif SC', '思源宋体', serif;
            --font-sans: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            --font-mono: 'Geist Mono', 'Sarasa Mono SC', 'Sarasa Mono', 'JetBrains Mono', monospace;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            padding: 28px 24px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px 24px;
            padding: 18px 28px;
            background: var(--color-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--color-border-light);
            margin-bottom: 24px;
            position: relative;
        }

        .app-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 28px;
            right: 28px;
            height: 2px;
            background: var(--color-primary);
            opacity: 0.3;
            border-radius: 2px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 700;
            color: var(--color-text);
            user-select: none;
            letter-spacing: 0.02em;
        }

        .app-header .brand .emoji {
            font-size: 26px;
            font-style: normal;
        }

        .app-header .brand .badge {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            color: var(--color-primary);
            background: var(--color-primary-bg);
            padding: 1px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            border: 1px solid oklch(0.50 0.16 25 / 0.15);
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13.5px;
            color: var(--color-text-secondary);
            font-weight: 450;
        }

        .header-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-stats .stat-item .num {
            font-weight: 600;
            color: var(--color-text);
            min-width: 20px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        .search-wrap {
            display: flex;
            align-items: center;
            background: transparent;
            border-bottom: 2px solid var(--color-border);
            padding: 0 4px 4px 4px;
            transition: border var(--transition), box-shadow var(--transition);
            flex: 1 1 260px;
            min-width: 160px;
            gap: 6px;
        }

        .search-wrap:focus-within {
            border-bottom-color: var(--color-primary);
            box-shadow: 0 2px 0 0 var(--color-primary-ring);
        }

        .search-wrap .icon {
            font-size: 16px;
            color: var(--color-text-muted);
            opacity: 0.7;
            flex-shrink: 0;
        }

        .search-wrap input {
            border: none;
            outline: none;
            background: transparent;
            padding: 8px 0 6px;
            font-size: 14.5px;
            width: 100%;
            color: var(--color-text);
            font-family: var(--font-sans);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .search-wrap input::placeholder {
            color: var(--color-text-muted);
            font-weight: 350;
            opacity: 0.7;
        }

        .search-wrap .clear-btn {
            background: none;
            border: none;
            font-size: 16px;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 4px 4px 4px 8px;
            display: none;
            transition: color var(--transition);
            line-height: 1;
            border-radius: 50%;
        }

        .search-wrap .clear-btn.visible {
            display: block;
        }

        .search-wrap .clear-btn:hover {
            color: var(--color-text);
            background: var(--color-border-light);
        }

        /* ============================================================
           FILTERS
           ============================================================ */
        .filters-section {
            background: var(--color-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--color-border-light);
            padding: 16px 24px 18px;
            margin-bottom: 24px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
        }

        .filter-row+.filter-row {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--color-border-light);
        }

        .filter-row .label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--color-text-secondary);
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            font-family: var(--font-sans);
            text-transform: uppercase;
            opacity: 0.7;
        }

        .filter-row .label .emoji {
            font-size: 14px;
            opacity: 0.8;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .filter-btn {
            padding: 4px 16px;
            border-radius: 30px;
            border: 1.5px solid var(--color-border);
            background: transparent;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        .filter-btn:hover {
            border-color: var(--color-primary-light);
            color: var(--color-primary);
            background: var(--color-primary-bg);
        }

        .filter-btn.active {
            border-color: var(--color-primary);
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 2px 12px oklch(0.50 0.16 25 / 0.25);
        }

        .filter-btn.active:hover {
            background: var(--color-primary-dark);
            border-color: var(--color-primary-dark);
        }

        .filter-tag {
            padding: 4px 14px 4px 12px;
            font-feature-settings: "ss01";
        }

        .filter-tag::before {
            content: "#";
            opacity: 0.4;
            margin-right: 2px;
            font-weight: 400;
        }

        .filter-tag.active::before {
            opacity: 1;
            color: #fff;
        }

        /* ============================================================
           RESULTS META
           ============================================================ */
        .results-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 18px;
            font-size: 13.5px;
            color: var(--color-text-secondary);
            padding: 0 4px;
            font-weight: 450;
        }

        .results-meta .count strong {
            color: var(--color-text);
            font-weight: 600;
            font-family: var(--font-serif);
            font-size: 15px;
        }

        .results-meta .clear-filters {
            background: none;
            border: none;
            color: var(--color-primary);
            font-weight: 500;
            font-size: 12.5px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 20px;
            transition: background var(--transition), color var(--transition);
            font-family: var(--font-sans);
            border: 1px solid transparent;
        }

        .results-meta .clear-filters:hover {
            background: var(--color-primary-bg);
            border-color: var(--color-border);
        }

        .results-meta .clear-filters.hidden {
            display: none;
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px 50px;
            color: var(--color-text-muted);
            background: var(--color-card);
            border-radius: var(--radius);
            border: 1px solid var(--color-border-light);
        }

        .empty-state .emoji {
            font-size: 52px;
            display: block;
            margin-bottom: 14px;
            opacity: 0.6;
        }

        .empty-state h3 {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .empty-state p {
            font-size: 14.5px;
            opacity: 0.7;
        }

        /* ============================================================
           PROMPT GRID
           ============================================================ */
        .prompt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .prompt-card {
            background: var(--color-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 22px 18px;
            cursor: pointer;
            transition: all var(--transition);
            border: 1.5px solid var(--color-border-light);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .prompt-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--color-primary-light);
            background: var(--color-card-hover);
        }

        .prompt-card:active {
            transform: scale(0.98);
        }

        /* ★ 内侧装饰条 — 更靠左 (left: 8px) ★ */
        .prompt-card::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 18px;
            bottom: 18px;
            width: 3px;
            background: var(--color-primary);
            border-radius: 3px;
            opacity: 0;
            transition: opacity var(--transition);
        }

        .prompt-card:hover::before {
            opacity: 0.4;
        }

        .prompt-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 6px;
        }

        .prompt-card .card-title {
            font-family: var(--font-serif);
            font-size: 17px;
            font-weight: 600;
            color: var(--color-text);
            line-height: 1.45;
            flex: 1;
            letter-spacing: 0.02em;
        }

        .prompt-card .card-category {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 600;
            color: var(--color-primary);
            background: var(--color-primary-bg);
            padding: 2px 12px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 2px;
            border: 1px solid oklch(0.50 0.16 25 / 0.10);
            letter-spacing: 0.3px;
        }

        .prompt-card .card-desc {
            font-size: 13.5px;
            color: var(--color-text-secondary);
            line-height: 1.65;
            margin: 4px 0 14px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-weight: 400;
        }

        .prompt-card .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: auto;
        }

        .prompt-card .card-tags .tag {
            font-family: var(--font-mono);
            font-size: 11.5px;
            font-weight: 450;
            padding: 1px 12px;
            border-radius: 20px;
            background: var(--color-bg);
            color: var(--color-text-secondary);
            transition: all var(--transition);
            border: 1px solid var(--color-border-light);
            letter-spacing: 0.01em;
        }

        .prompt-card .card-tags .tag:hover {
            background: var(--color-primary-bg);
            color: var(--color-primary);
            border-color: var(--color-primary-light);
        }

        .prompt-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--color-border-light);
            font-size: 12px;
            color: var(--color-text-muted);
            font-weight: 400;
        }

        .prompt-card .card-footer .date {
            display: flex;
            align-items: center;
            gap: 4px;
            font-feature-settings: "tnum";
        }

        .prompt-card .card-footer .hint {
            font-size: 12px;
            color: var(--color-text-muted);
            opacity: 0.5;
            font-style: italic;
            transition: opacity var(--transition);
        }

        .prompt-card:hover .card-footer .hint {
            opacity: 0.9;
            color: var(--color-primary);
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: oklch(0.08 0.01 0 / 0.55);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.open {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-box {
            background: var(--color-card);
            border-radius: var(--radius);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px 28px;
            box-shadow: var(--shadow-modal);
            border: 1px solid var(--color-border-light);
            position: relative;
        }

        .modal-box::-webkit-scrollbar {
            width: 4px;
        }

        .modal-box::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 10px;
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 26px;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 0 0 0 16px;
            transition: color var(--transition);
            line-height: 1;
            z-index: 1;
            font-family: var(--font-sans);
        }

        .modal-close:hover {
            color: var(--color-text);
        }

        .modal-box .modal-category {
            display: inline-block;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 600;
            color: var(--color-primary);
            background: var(--color-primary-bg);
            padding: 2px 14px;
            border-radius: 20px;
            margin-bottom: 8px;
            border: 1px solid oklch(0.50 0.16 25 / 0.10);
            letter-spacing: 0.3px;
        }

        .modal-box .modal-title {
            font-family: var(--font-serif);
            font-size: 26px;
            font-weight: 700;
            color: var(--color-text);
            margin: 2px 0 12px;
            line-height: 1.35;
            padding-right: 40px;
            letter-spacing: 0.02em;
        }

        .modal-box .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .modal-box .modal-tags .tag {
            font-family: var(--font-mono);
            font-size: 12.5px;
            font-weight: 450;
            padding: 2px 14px;
            border-radius: 20px;
            background: var(--color-bg);
            color: var(--color-text-secondary);
            border: 1px solid var(--color-border-light);
            letter-spacing: 0.01em;
        }

        .modal-box .modal-content {
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.8;
            color: var(--color-text);
            white-space: pre-wrap;
            word-break: break-word;
            background: var(--color-bg);
            padding: 18px 22px;
            border-radius: var(--radius-sm);
            margin: 4px 0 20px;
            border-left: 4px solid var(--color-primary);
            max-height: 320px;
            overflow-y: auto;
            font-feature-settings: "ss01", "ss02";
            letter-spacing: 0.01em;
        }

        .modal-box .modal-content::-webkit-scrollbar {
            width: 4px;
        }

        .modal-box .modal-content::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 10px;
        }

        .modal-box .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 2px;
        }

        .modal-box .modal-actions .btn {
            padding: 8px 24px;
            border-radius: 30px;
            border: none;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.02em;
        }

        .modal-box .modal-actions .btn-primary {
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 2px 12px oklch(0.50 0.16 25 / 0.25);
        }

        .modal-box .modal-actions .btn-primary:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px oklch(0.50 0.16 25 / 0.35);
        }

        .modal-box .modal-actions .btn-primary:active {
            transform: scale(0.97);
        }

        .modal-box .modal-actions .btn-secondary {
            background: var(--color-bg);
            color: var(--color-text-secondary);
            border: 1.5px solid var(--color-border);
        }

        .modal-box .modal-actions .btn-secondary:hover {
            background: var(--color-border-light);
            color: var(--color-text);
        }

        .modal-box .modal-meta {
            font-size: 12px;
            color: var(--color-text-muted);
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--color-border-light);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 12px;
            font-feature-settings: "tnum";
            font-weight: 400;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--color-text);
            color: #fff;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 13.5px;
            font-weight: 500;
            box-shadow: 0 8px 32px oklch(0 0 0 / 0.18);
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s ease;
            z-index: 2000;
            font-family: var(--font-sans);
            letter-spacing: 0.02em;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 900px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 16px 20px;
            }

            .app-header .brand {
                font-size: 20px;
            }

            .header-stats {
                font-size: 13px;
                gap: 14px;
                flex-wrap: wrap;
            }

            .search-wrap {
                flex: 1 1 100%;
            }

            .filters-section {
                padding: 14px 16px 16px;
            }

            .filter-row {
                gap: 6px 10px;
            }

            .filter-btn {
                font-size: 12px;
                padding: 3px 13px;
            }

            .prompt-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 14px;
            }

            .modal-box {
                padding: 24px 20px 20px;
                margin: 12px;
            }

            .modal-box .modal-title {
                font-size: 22px;
                padding-right: 30px;
            }

            .modal-box .modal-content {
                font-size: 13.5px;
                padding: 14px 16px;
                max-height: 220px;
            }

            .prompt-card::before {
                left: 6px;
                top: 14px;
                bottom: 14px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .app-header .brand {
                font-size: 18px;
            }

            .app-header .brand .badge {
                font-size: 10px;
                padding: 0 10px;
            }

            .prompt-grid {
                grid-template-columns: 1fr;
            }

            .prompt-card {
                padding: 16px 16px 14px;
            }

            .modal-box {
                padding: 16px 14px 16px;
                max-height: 95vh;
            }

            .modal-box .modal-title {
                font-size: 19px;
            }

            .modal-box .modal-actions .btn {
                padding: 6px 18px;
                font-size: 12.5px;
            }

            .filters-section {
                padding: 10px 12px 12px;
            }

            .filter-row+.filter-row {
                margin-top: 8px;
                padding-top: 8px;
            }

            .results-meta {
                font-size: 12.5px;
            }

            .prompt-card::before {
                left: 4px;
                top: 12px;
                bottom: 12px;
                width: 2.5px;
            }
        }

        /* ============================================================
           UTILITIES
           ============================================================ */
        .hidden {
            display: none !important;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <header class="app-header">
            <div class="brand">
                <span class="emoji">📚</span>
                提示词灵感库
                <span class="badge">v1.0</span>
            </div>
            <div class="header-stats">
                <span class="stat-item">
                    📦 总数 <span class="num" id="totalCount">0</span>
                </span>
                <span class="stat-item">
                    🎯 当前 <span class="num" id="filteredCount">0</span>
                </span>
            </div>
            <div class="search-wrap" role="search">
                <span class="icon">🔍</span>
                <input
                type="text"
                id="searchInput"
                placeholder="搜索标题、描述或内容…"
                aria-label="搜索提示词"
                autocomplete="off"
                />
                <button class="clear-btn" id="clearSearch" aria-label="清除搜索">✕</button>
            </div>
        </header>

        <section class="filters-section" aria-label="筛选提示词">
            <div class="filter-row">
                <span class="label"><span class="emoji">📂</span> 分类</span>
                <div class="filter-group" id="categoryFilters"></div>
            </div>
            <div class="filter-row">
                <span class="label"><span class="emoji">🏷️</span> 标签</span>
                <div class="filter-group" id="tagFilters"></div>
            </div>
        </section>

        <div class="results-meta">
            <span class="count" id="resultMeta">
                找到 <strong id="resultCount">0</strong> 个提示词
            </span>
            <button class="clear-filters hidden" id="clearAllFilters">
                ✕ 清除所有筛选
            </button>
        </div>

        <main class="prompt-grid" id="promptGrid" role="list"></main>

        <div class="empty-state hidden" id="emptyState">
            <span class="emoji">🔮</span>
            <h3>没有找到匹配的提示词</h3>
            <p>试试调整筛选条件或搜索关键词吧</p>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-box">
            <button class="modal-close" id="modalClose" aria-label="关闭详情">✕</button>
            <span class="modal-category" id="modalCategory">分类</span>
            <h2 class="modal-title" id="modalTitle">标题</h2>
            <div class="modal-tags" id="modalTags"></div>
            <div class="modal-content" id="modalContent">内容</div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="modalCopyBtn">📋 复制提示词</button>
                <button class="btn btn-secondary" id="modalCloseBtn">关闭</button>
            </div>
            <div class="modal-meta">
                <span id="modalDate">📅 创建日期</span>
                <span id="modalId">#ID</span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            const $ = (sel, ctx = document) => ctx.querySelector(sel);
            const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

            const grid = $('#promptGrid');
            const emptyState = $('#emptyState');
            const totalCount = $('#totalCount');
            const filteredCount = $('#filteredCount');
            const resultCount = $('#resultCount');
            const resultMeta = $('#resultMeta');
            const clearAllBtn = $('#clearAllFilters');

            const searchInput = $('#searchInput');
            const clearSearch = $('#clearSearch');

            const categoryFilters = $('#categoryFilters');
            const tagFilters = $('#tagFilters');

            const modalOverlay = $('#modalOverlay');
            const modalClose = $('#modalClose');
            const modalCloseBtn = $('#modalCloseBtn');
            const modalTitle = $('#modalTitle');
            const modalCategory = $('#modalCategory');
            const modalTags = $('#modalTags');
            const modalContent = $('#modalContent');
            const modalDate = $('#modalDate');
            const modalId = $('#modalId');
            const modalCopyBtn = $('#modalCopyBtn');

            const toast = $('#toast');

            let prompts = [];
            let filtered = [];
            let selectedCategory = '全部';
            let selectedTag = null;
            let searchQuery = '';

            async function loadPromptData() {
                try {
                    const response = await fetch('prompts.json');
                    if (!response.ok) throw new Error(`HTTP ${response.status} - ${response.statusText}`);
                    const data = await response.json();
                    if (!Array.isArray(data)) throw new Error('数据格式错误：根元素必须是数组');
                    prompts = data;
                    prompts.sort((a, b) => (b.id || 0) - (a.id || 0));
                    console.log(`✅ 成功加载 ${prompts.length} 条提示词 (来自 prompts.json)`);
                    return true;
                } catch (err) {
                    console.error('❌ 加载 prompts.json 失败:', err);
                    prompts = [];
                    return false;
                }
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function formatDate(dateStr) {
                if (!dateStr) return '未知日期';
                try {
                    const d = new Date(dateStr);
                    return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
                } catch {
                    return dateStr;
                }
            }

            function showToast(msg, duration = 2000) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
            }

            function getAllCategories() {
                const set = new Set(prompts.map(p => p.category || '其他'));
                return ['全部', ...set].filter(Boolean);
            }

            function getAllTags() {
                const set = new Set();
                prompts.forEach(p => {
                    if (Array.isArray(p.tags)) {
                        p.tags.forEach(t => set.add(t));
                    }
                });
                return [...set].sort();
            }

            function filterPrompts() {
                const query = searchQuery.trim().toLowerCase();

                filtered = prompts.filter(p => {
                    if (selectedCategory !== '全部' && p.category !== selectedCategory) return false;
                    if (selectedTag !== null) {
                        if (!Array.isArray(p.tags) || !p.tags.includes(selectedTag)) return false;
                    }
                    if (query) {
                        const title = (p.title || '').toLowerCase();
                        const desc = (p.description || '').toLowerCase();
                        const content = (p.content || '').toLowerCase();
                        if (!title.includes(query) && !desc.includes(query) && !content.includes(query)) {
                            return false;
                        }
                    }
                    return true;
                });

                renderStats();
                renderGrid();
                updateClearButton();
            }

            function renderStats() {
                totalCount.textContent = prompts.length;
                filteredCount.textContent = filtered.length;
                resultCount.textContent = filtered.length;
                const suffix = filtered.length === 1 ? '个提示词' : '个提示词';
                resultMeta.innerHTML =
                    `找到 <strong>${filtered.length}</strong> ${suffix}`;
            }

            function renderGrid() {
                if (filtered.length === 0) {
                    grid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                let html = '';
                filtered.forEach(p => {
                    const tagsHtml = Array.isArray(p.tags) ?
                        p.tags.map(t => `<span class="tag" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</span>`)
                        .join('') :
                        '';

                    html += `
                        <div class="prompt-card" data-id="${p.id}" role="listitem">
                            <div class="card-top">
                                <div class="card-title">${escapeHtml(p.title || '无标题')}</div>
                                <span class="card-category">${escapeHtml(p.category || '其他')}</span>
                            </div>
                            <div class="card-desc">${escapeHtml(p.description || '暂无描述')}</div>
                            <div class="card-tags">${tagsHtml}</div>
                            <div class="card-footer">
                                <span class="date">📅 ${formatDate(p.createdAt)}</span>
                                <span class="hint">点击查看 →</span>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;

                grid.querySelectorAll('.prompt-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.classList.contains('tag')) {
                            const tag = e.target.dataset.tag;
                            if (tag) {
                                handleTagClick(tag);
                            }
                            return;
                        }
                        const id = parseInt(this.dataset.id, 10);
                        const prompt = prompts.find(p => p.id === id);
                        if (prompt) openModal(prompt);
                    });
                });
            }

            grid.addEventListener('click', function(e) {
                const tagEl = e.target.closest('.tag');
                if (tagEl && tagEl.dataset.tag) {
                    e.stopPropagation();
                    handleTagClick(tagEl.dataset.tag);
                }
            });

            function renderFilters() {
                const categories = getAllCategories();
                categoryFilters.innerHTML = categories.map(cat =>
                    `<button class="filter-btn ${cat === selectedCategory ? 'active' : ''}" data-category="${cat}">${cat}</button>`
                ).join('');

                const tags = getAllTags();
                tagFilters.innerHTML = tags.map(tag =>
                    `<button class="filter-btn filter-tag ${tag === selectedTag ? 'active' : ''}" data-tag="${tag}">${tag}</button>`
                ).join('');

                categoryFilters.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const cat = this.dataset.category;
                        if (selectedCategory === cat) {
                            selectedCategory = '全部';
                        } else {
                            selectedCategory = cat;
                        }
                        categoryFilters.querySelectorAll('.filter-btn').forEach(b =>
                            b.classList.toggle('active', b.dataset.category === selectedCategory)
                        );
                        filterPrompts();
                    });
                });

                tagFilters.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const tag = this.dataset.tag;
                        if (selectedTag === tag) {
                            selectedTag = null;
                        } else {
                            selectedTag = tag;
                        }
                        tagFilters.querySelectorAll('.filter-btn').forEach(b =>
                            b.classList.toggle('active', b.dataset.tag === selectedTag)
                        );
                        filterPrompts();
                    });
                });
            }

            function handleTagClick(tag) {
                if (selectedTag === tag) {
                    selectedTag = null;
                } else {
                    selectedTag = tag;
                }
                tagFilters.querySelectorAll('.filter-btn').forEach(b =>
                    b.classList.toggle('active', b.dataset.tag === selectedTag)
                );
                filterPrompts();
            }

            function openModal(prompt) {
                modalTitle.textContent = prompt.title || '无标题';
                modalCategory.textContent = prompt.category || '其他';
                modalContent.textContent = prompt.content || '（暂无内容）';
                modalDate.textContent = `📅 ${formatDate(prompt.createdAt)}`;
                modalId.textContent = `#${prompt.id}`;

                modalTags.innerHTML = Array.isArray(prompt.tags) ?
                    prompt.tags.map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('') :
                    '';

                modalCopyBtn.dataset.id = prompt.id;

                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('open');
                document.body.style.overflow = '';
            }

            function copyCurrentPrompt() {
                const id = parseInt(modalCopyBtn.dataset.id, 10);
                const prompt = prompts.find(p => p.id === id);
                if (!prompt) {
                    showToast('❌ 未找到提示词');
                    return;
                }
                const content = prompt.content || '';
                if (!content) {
                    showToast('❌ 内容为空');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(content).then(() => {
                        showToast('✅ 已复制到剪贴板！');
                    }).catch(() => {
                        fallbackCopy(content);
                    });
                } else {
                    fallbackCopy(content);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.top = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('✅ 已复制到剪贴板！');
                } catch {
                    showToast('❌ 复制失败，请手动复制');
                }
                document.body.removeChild(ta);
            }

            function clearAllFilters() {
                selectedCategory = '全部';
                selectedTag = null;
                searchQuery = '';
                searchInput.value = '';
                clearSearch.classList.remove('visible');

                categoryFilters.querySelectorAll('.filter-btn').forEach(b =>
                    b.classList.toggle('active', b.dataset.category === '全部')
                );
                tagFilters.querySelectorAll('.filter-btn').forEach(b =>
                    b.classList.remove('active')
                );

                filterPrompts();
            }

            function updateClearButton() {
                const hasFilter = selectedCategory !== '全部' || selectedTag !== null || searchQuery.trim() !== '';
                clearAllBtn.classList.toggle('hidden', !hasFilter);
            }

            searchInput.addEventListener('input', function() {
                searchQuery = this.value;
                clearSearch.classList.toggle('visible', this.value.length > 0);
                filterPrompts();
            });

            clearSearch.addEventListener('click', function() {
                searchInput.value = '';
                searchQuery = '';
                this.classList.remove('visible');
                filterPrompts();
            });

            modalClose.addEventListener('click', closeModal);
            modalCloseBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            modalCopyBtn.addEventListener('click', copyCurrentPrompt);

            clearAllBtn.addEventListener('click', clearAllFilters);

            async function initApp() {
                await loadPromptData();
                renderFilters();
                filterPrompts();

                if (prompts.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <span class="emoji">📝</span>
                            <h3>还没有提示词</h3>
                            <p>请在 <code>prompts.json</code> 中添加你的数据</p>
                        </div>
                    `;
                    emptyState.classList.add('hidden');
                }

                console.log('✅ 提示词灵感库已启动！');
            }

            if (document.readyState === 'complete') {
                initApp();
            } else {
                window.addEventListener('load', initApp);
            }

        })();
    </script>

</body>
</html>
