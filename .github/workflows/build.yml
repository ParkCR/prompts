name: Build prompts.json from Markdown

on:
  push:
    paths:
      - 'prompts/**/*.md'
    branches:
      - main                # 若默认分支为 master，请改为 master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install gray-matter

      - name: Generate prompts.json
        run: node .github/scripts/build.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add prompts.json
          git diff --staged --quiet || git commit -m "chore: update prompts.json from Markdown files"
          git push
